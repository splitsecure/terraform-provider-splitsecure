name: Release

# Triggered when a tag matching v* (e.g. v0.1.0) is pushed. The tag
# version must match the contents of the VERSION file at the repo
# root -- the verify step below blocks the release if they drift.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # goreleaser walks tag history for changelog and version data.
          fetch-depth: 0

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          version_file="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version_file" != "$tag_version" ]; then
            echo "VERSION file ($version_file) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          args: release --draft --clean --skip=sign
        env:
          # GITHUB_TOKEN is auto-provided by the runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
