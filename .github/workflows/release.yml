name: Release

# Triggered when a tag matching v* (e.g. v0.1.0) is pushed. The tag
# version must match the contents of the VERSION file at the repo
# root -- the verify step below blocks the release if they drift.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser walks tag history for changelog and version data.
          fetch-depth: 0

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          version_file="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version_file" != "$tag_version" ]; then
            echo "VERSION file ($version_file) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --draft --clean
        env:
          # GITHUB_TOKEN is auto-provided by the runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Signs SHA256SUMS with the SplitSecure release key, verifies the signature
  # against the committed public key, then publishes the draft. A quorum
  # approves each signature.
  sign:
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Sign and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPLITSECURE_ENDPOINT: ${{ vars.SPLITSECURE_ENDPOINT }}
          SPLITSECURE_SERVICE_ACCOUNT: ${{ vars.SPLITSECURE_SERVICE_ACCOUNT }}
          SPLITSECURE_VAULT_ID: ${{ vars.SPLITSECURE_VAULT_ID }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern '*_SHA256SUMS'
          sums="$(ls ./*_SHA256SUMS)"
          go run ./cmd/sign-release \
            -endpoint "$SPLITSECURE_ENDPOINT" \
            -service-account "$SPLITSECURE_SERVICE_ACCOUNT" \
            -vault "$SPLITSECURE_VAULT_ID" \
            -key "$RELEASE_SIGNING_KEY_ID" \
            -justification "Release $GITHUB_REF_NAME, commit ${GITHUB_SHA:0:12}, run $GITHUB_RUN_ID" \
            -in "$sums" -out "$sums.sig"
          gpg --dearmor < .github/release-signing-key.asc > release-signing-key.gpg
          gpgv --keyring ./release-signing-key.gpg "$sums.sig" "$sums"
          gh release upload "$GITHUB_REF_NAME" "$sums.sig"
          gh release edit "$GITHUB_REF_NAME" --draft=false
