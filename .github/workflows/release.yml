name: Release

# Triggered when a tag matching v* (e.g. v0.1.0) is pushed. The tag
# version must match the contents of the VERSION file at the repo
# root -- the verify step below blocks the release if they drift.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser walks tag history for changelog and version data.
          fetch-depth: 0

      - name: Verify VERSION matches tag
        run: |
          set -euo pipefail
          version_file="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$version_file" != "$tag_version" ]; then
            echo "VERSION file ($version_file) does not match tag ($tag_version)" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --draft --clean --skip=sign
        env:
          # GITHUB_TOKEN is auto-provided by the runner.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
