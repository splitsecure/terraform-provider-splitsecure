syntax = "proto3";
package splitsecure.proposals.v1;

import "google/protobuf/timestamp.proto";
import "splitsecure/requestsigning/v1/signed_request.proto";

// Slim service definition for the Terraform provider. Only declares
// GetProposal (+ its supporting types). The full server-side
// ProposalsService also has Publish/Vote/Complete/Watch/List/... but
// the provider polls GetProposal only; bringing in the rest would drag
// threshold + bottle + hybridkeyset dependencies.
service ProposalsService {
  rpc GetProposal(GetProposalRequest) returns (GetProposalResponse);
}

message GetProposalRequest {
  requestsigning.v1.SignedRequest signed = 1;
  Base base = 2;
  message Base {
    bytes proposal_id = 1;
  }
}

message GetProposalResponse {
  ProposalMetadata metadata = 1;
  bytes stream_id = 2;
}

message ProposalMetadata {
  bytes proposal_id = 1;
  ProposalStatus status = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 current_step = 5;
  bytes initiator_enclave_id = 6;
  repeated bytes team_ids = 7;
  string flow_id = 8;
}

message ProposalStatus {
  oneof status {
    InProgress in_progress = 1;
    Completed completed = 2;
    Error error = 3;
  }
  message InProgress {}
  message Completed {}
  message Error {
    string message = 1;
  }
}
