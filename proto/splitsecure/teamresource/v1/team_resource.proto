syntax = "proto3";
package splitsecure.teamresource.v1;

import "splitsecure/hybridkeyset/v1/hybridkeyset.proto";
import "splitsecure/notifications/v1/notification_policy.proto";

// TeamSignature binds a resource to a team.
// The team's base signer signs serialized authenticated bytes.
message TeamSignature {
  // team_id is the hash of the team's base identity.
  bytes team_id = 1;

  // signature is the team base signer's signature over the authenticated bytes.
  splitsecure.hybridkeyset.v1.Signature signature = 2;
}

// NotificationMode specifies how team members should be notified for a request.
message NotificationMode {
  oneof mode {
    // notify_everyone sends push notifications to all team members.
    NotifyEveryone notify_everyone = 1;

    // selective sends push notifications only to the specified devices;
    // all others receive silent notifications (stored but no push).
    SelectiveNotification selective = 2;
  }

  message NotifyEveryone {}

  message SelectiveNotification {
    repeated bytes actively_notify_enclave_ids = 1;
  }
}

// BaseResourceAttributes holds the common metadata shared by all managed resources.
message BaseResourceAttributes {
  string name = 1;
  string description = 2;
  splitsecure.notifications.v1.NotificationPolicy notification_policy = 3;
  AccountSensitivity sensitivity = 4;
  bytes proposal_id = 5;
}

enum AccountSensitivityLevel {
  ACCOUNT_SENSITIVITY_LEVEL_UNSPECIFIED = 0;
  ACCOUNT_SENSITIVITY_LEVEL_LOW = 1;
  ACCOUNT_SENSITIVITY_LEVEL_MEDIUM = 2;
  ACCOUNT_SENSITIVITY_LEVEL_HIGH = 3;
  ACCOUNT_SENSITIVITY_LEVEL_CRITICAL = 4;
}

message AccountSensitivity {
  AccountSensitivityLevel level = 1;
  string description = 2;
}
