syntax = "proto3";
package splitsecure.conveniencestore.v1;

import "splitsecure/conveniencestore/v1/saml2_resource.proto";
import "splitsecure/requestsigning/v1/signed_request.proto";

// GetSAML2ResourcesRequest fetches specific SAML2 IdP or SP records by
// their s2r URIs. Callers holding a known set of resource_s2rs can use
// this instead of ListSAML2Resources + client-side filter.
message GetSAML2ResourcesRequest {
  splitsecure.requestsigning.v1.SignedRequest signed = 1;

  Base base = 2;
  message Base {
    // resource_s2rs are the SAML2 resource URIs to look up. Each must
    // be a saml2idp or saml2sp URI; the two kinds may be mixed.
    repeated string resource_s2rs = 1;
  }
}

message GetSAML2ResourcesResponse {
  // resources maps each found record's resource_s2r to the record.
  // Keys absent from the map mean the record was not found, the
  // caller is unauthorized on its owning team, the s2r was malformed,
  // or the minting proposal has not yet completed.
  map<string, SAML2ResourceRecord> resources = 1;
}
