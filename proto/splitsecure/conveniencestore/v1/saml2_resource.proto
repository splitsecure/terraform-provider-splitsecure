syntax = "proto3";
package splitsecure.conveniencestore.v1;

import "google/protobuf/timestamp.proto";
import "splitsecure/conveniencestore/v1/tombstone.proto";
import "splitsecure/enclaveservices/saml2/v1/idp_state.proto";
import "splitsecure/enclaveservices/saml2/v2/authenticated_idp_state_and_key.proto";
import "splitsecure/enclaveservices/saml2/v2/authenticated_saml2_service_provider.proto";
import "splitsecure/notifications/v1/notification_policy.proto";
import "splitsecure/saml2metadatafetcherservice/v1/metadata.proto";
import "splitsecure/teamresource/v1/team_resource.proto";

message SAML2ResourceRecord {
  bytes id = 1;
  google.protobuf.Timestamp created_at = 2;
  Content content = 3;

  // resource_s2r is the stable resource URI. Kind is "saml2idp" for an IdP
  // record or "saml2sp" for an SP record. Populated server-side on read
  // from the team snowflake and the resource id; not persisted in DDB.
  // Empty for pure-tombstone records that can't be classified from content.
  string resource_s2r = 4;

  oneof record {
    Tombstone tombstone = 10;
    SAML2ServiceProvider provider = 11; // v1
    splitsecure.enclaveservices.saml2.v1.IdPStateAndKey idp = 12; // v1
    splitsecure.enclaveservices.saml2.v2.AuthenticatedSAML2ServiceProvider signed_service_provider = 13; // v2
    splitsecure.enclaveservices.saml2.v2.AuthenticatedIdPStateAndKey signed_idp = 14; // v2
  }

  message Content {
    oneof union {
      Tombstone tombstone = 1;
      UpdateableRecord updateable_record = 2;
    }
  }

  message UpdateableRecord {
    // The ID of the canonical resource record
    bytes original_id = 1;

    // The last time this record was updated
    google.protobuf.Timestamp updated_at = 2;

    UpdateableContent content = 3;
  }

  message UpdateableContent {
    oneof union {
      splitsecure.enclaveservices.saml2.v2.AuthenticatedSAML2ServiceProvider signed_service_provider = 1;
      splitsecure.enclaveservices.saml2.v2.AuthenticatedIdPStateAndKey signed_idp = 2;
    }
  }
}

message SAML2ServiceProvider {
  string name = 1;
  string acs = 2;
  string idp_id = 3;
  string entity_id = 4 [deprecated = true]; // Deprecated in favor of metadata.entity_descriptor.entity_id
  splitsecure.saml2metadatafetcherservice.v1.Metadata metadata = 5;
  splitsecure.teamresource.v1.AccountSensitivity sensitivity = 7;

  // notification_policy controls how notifications are sent for proposals
  // involving this service provider. Copied from IdPState at creation time.
  splitsecure.notifications.v1.NotificationPolicy notification_policy = 6;

  // base_resource_attributes is the unified resource metadata view.
  // When present, consumers should prefer this over the flat fields above.
  // Both paths are supported for backwards compatibility.
  splitsecure.teamresource.v1.BaseResourceAttributes base_resource_attributes = 8;

  oneof account {
    AWS aws = 100;
    Cloudflare cloudflare = 112;
    EventBrite event_brite = 105;
    GCP gcp = 106;
    GoogleWorkspace google_workspace = 101;
    GoogleWorkspaceLegacy google_workspace_legacy = 110;
    IBMCloud ibm_cloud = 113;
    Kandji kandji = 111;
    MicrosoftEntraID microsoft_entra_id = 107;
    Okta okta = 103;
    OracleCloud oracle_cloud = 114;
    PagerDuty pager_duty = 115;
    PitchBook pitch_book = 108;
    Rapid7 rapid7 = 116;
    Stripe stripe = 102;
    Veeam veeam = 104;
    Workday workday = 109;
  }

  message AWS {
    // string account_id = 1;
    string saml_provider_arn = 2;
    string default_role_arn = 3 [deprecated = true];
    repeated string allowed_role_arns = 4;
  }

  message Cloudflare {
    string sso_endpoint = 1;
    string default_email = 2;
  }

  message EventBrite {}

  message GCP {
    string default_email = 1;
  }

  message GoogleWorkspace {
    // tbd
  }

  message GoogleWorkspaceLegacy {
    string default_email = 1;
    string domain_name = 2;
  }

  message IBMCloud {
    string login_url = 1;
  }

  message Kandji {
    string default_email = 1;
  }

  message MicrosoftEntraID {}

  message Okta {
    repeated string allowed_emails = 1;
  }

  message OracleCloud {}

  message PagerDuty {}

  message PitchBook {}

  message Rapid7 {
    string default_relay_state = 1;
    string default_email = 2;
    string default_first_name = 3;
    string default_last_name = 4;
    repeated string default_rbac_groups = 5;
  }

  message Stripe {
    string account_id = 1;
  }

  message Veeam {}
  message Workday {}

  // GlobalRelay
  // DeepVue
}
