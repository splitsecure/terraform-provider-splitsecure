# GoReleaser config for the SplitSecure Terraform Provider.
# Built from the HashiCorp scaffolding template; produces the artifact
# set the public Terraform Registry expects:
#   terraform-provider-splitsecure_v{VERSION}                          (binary)
#   terraform-provider-splitsecure_{VERSION}_{OS}_{ARCH}.zip           (per-platform archive)
#   terraform-provider-splitsecure_{VERSION}_manifest.json             (registry manifest)
#   terraform-provider-splitsecure_{VERSION}_SHA256SUMS                (checksums incl. manifest)
#   terraform-provider-splitsecure_{VERSION}_SHA256SUMS.sig            (GPG signature on checksums)
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # CGO_ENABLED=0 keeps the binary self-contained and lets HCP
      # Terraform load it without OS-level libs.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  # The manifest is included in the checksum file so the registry
  # verifies it alongside the archives.
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
