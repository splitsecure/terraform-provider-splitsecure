version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/splitsecure/terraform-provider-splitsecure/gen/go/proto
plugins:
  - local: protoc-gen-go
    out: gen/go/proto
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go/proto
    opt:
      - paths=source_relative
